<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vanesa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#fff3f7;--card:#fff;--ink:#4a2142;--mute:#85607c;--rose:#c93d78;--rose-d:#a82f60;--on:#fff;--petal:#f9d3e2;--gold:#8a5a0c;--line:#f0d6e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26121f;--card:#341a2c;--ink:#fbe7f0;--mute:#d2a9c0;--rose:#ee6fa3;--rose-d:#f48ab6;--on:#2a0f20;--petal:#4a2640;--gold:#f0c070;--line:#4f2c44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#26121f;--card:#341a2c;--ink:#fbe7f0;--mute:#d2a9c0;--rose:#ee6fa3;--rose-d:#f48ab6;--on:#2a0f20;--petal:#4a2640;--gold:#f0c070;--line:#4f2c44;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font:italic 600 3.4rem/1 "Cormorant Garamond",Georgia,serif;color:var(--rose);margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:700;margin:12px 0 4px}
input{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
:is(input,button,a):focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 24px;background:var(--rose);color:var(--on);cursor:pointer}
.btn:hover{background:var(--rose-d)}
.ghost{background:transparent;color:var(--rose);box-shadow:inset 0 0 0 1.5px var(--rose)}
.ghost:hover{background:var(--petal)}
.clock{display:flex;flex-direction:column;align-items:center;text-align:center;margin:8px 0 22px}
#mark{width:200px;height:200px;border-radius:50%;border:0;background:var(--rose);color:var(--on);font:inherit;cursor:pointer;box-shadow:0 0 0 10px var(--petal);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:10px 0 18px}
#mark:hover:not(:disabled){background:var(--rose-d)}
#mark:disabled{background:var(--mute);cursor:default}
#mark b{font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
#mark span{font-weight:700}
.clock p{margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:1.2rem;color:var(--rose)}
.stat.x b{color:var(--gold)}
.stat small{color:var(--mute)}
.tw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.85rem}
td.x{color:var(--gold);font-weight:700}
.del{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:4px 6px}
#err{color:var(--rose);font-weight:700;min-height:1.5em;margin:8px 0}
a{color:var(--rose);font-weight:700}
</style>
</head>
<body>
<main>
<h1>Vanesa</h1>
<p class="sub">Lunes a Jueves: 9:00 a 17:40, Viernes: 9:00 a 16:40</p>

<section id="app">
  <div class="clock">
    <button id="mark"><span id="ml"></span><b id="mt"></b></button>
    <p id="today"></p>
    <p id="wa" aria-live="polite"></p>
  </div>
  <div class="stats">
    <div class="stat x"><b id="sx"></b><small>Extras del mes</small></div>
    <div class="stat"><b id="sw"></b><small>Trabajadas</small></div>
    <div class="stat"><b id="sm"></b><small>Días sin marcar</small></div>
  </div>
  <div class="card">
    <b>Historial del mes</b>
    <div class="tw"><table>
      <thead><tr><th>Día</th><th>Ingreso</th><th>Salida</th><th>Trabajadas</th><th>Extras</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
  <p class="sub">Tus registros se guardan solo en este dispositivo.</p>
</section>
</main>
<script>
const K='vanesa:v1',TO='56950864936',EXIT={1:'17:40',2:'17:40',3:'17:40',4:'17:40',5:'16:40'},
DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
let S={rec:{}},pend=null,last='';
try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.rec)S=r}catch(e){}
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),
save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},
ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
hm=d=>pad(d.getHours())+':'+pad(d.getMinutes()),
mins=t=>{const a=t.split(':');return +a[0]*60+ +a[1]},
fmt=m=>Math.floor(m/60)+'h '+pad(m%60)+'m',
wdOf=k=>new Date(k+'T00:00').getDay();

function calc(k,r,now){
  const o=r.o||now;if(!o)return{w:0,x:0};
  const a=mins(r.i);let b=mins(o);if(b<a)b+=1440;
  const e=EXIT[wdOf(k)];
  return{w:b-a,x:e?Math.max(0,b-mins(e)):b-a};
}
function showWa(t,go){
  const u='https://wa.me/'+TO+'?text='+encodeURIComponent(t);
  $('wa').innerHTML='<a href="'+u+'" target="_blank" rel="noopener">Abrir WhatsApp con el mensaje listo</a>';
  if(go)window.open(u,'_blank','noopener');
}
function render(){
  const n=new Date(),k=ymd(n),r=S.rec[k],wd=n.getDay();
  $('mt').textContent=hm(n);
  $('ml').textContent=!r?'Marcar ingreso':!r.o?'Marcar salida':'Jornada completa';
  $('mark').disabled=!!(r&&r.o);
  $('today').textContent='Hoy es '+DAYS[wd]+(EXIT[wd]?' y tu salida es a las '+EXIT[wd]+'.':'; fuera de horario, todo lo trabajado cuenta como extra.');
  let W=0,X=0,rows='';
  Object.keys(S.rec).filter(d=>d.slice(0,7)===k.slice(0,7)).sort().reverse().forEach(d=>{
    const q=S.rec[d],c=calc(d,q,d===k?hm(n):null),dt=d.slice(8)+'/'+d.slice(5,7),ok=q.o||d===k;
    W+=c.w;X+=c.x;
    rows+='<tr><td>'+DAYS[wdOf(d)].slice(0,3)+' '+dt+'</td><td>'+q.i+'</td><td>'+(q.o||'—')+'</td><td>'+(ok?fmt(c.w):'—')+'</td><td class="x">'+(ok?fmt(c.x):'—')+'</td><td><button class="del" data-d="'+d+'" aria-label="Borrar '+dt+'">'+(pend===d?'¿Borrar?':'×')+'</button></td></tr>';
  });
  if(rows!==last){last=rows;$('rows').innerHTML=rows||'<tr><td colspan="6">Aún no hay registros este mes.</td></tr>'}
  let miss=0;
  for(let d=1;d<n.getDate();d++){const t=new Date(n.getFullYear(),n.getMonth(),d),g=t.getDay();if(g>0&&g<6&&!S.rec[ymd(t)])miss++}
  $('sx').textContent=fmt(X);$('sw').textContent=fmt(W);$('sm').textContent=miss;
}
$('mark').onclick=()=>{
  const n=new Date(),k=ymd(n),r=S.rec[k];
  if(!r){
    S.rec[k]={i:hm(n)};save();
    showWa('Ingreso registrado el '+DAYS[n.getDay()]+' '+pad(n.getDate())+'/'+pad(n.getMonth()+1)+' a las '+hm(n)+'.'+(EXIT[n.getDay()]?' Salida programada: '+EXIT[n.getDay()]+'.':''),true);
  }else if(!r.o){
    r.o=hm(n);save();const c=calc(k,r);
    showWa('Salida registrada a las '+r.o+'. Trabajadas: '+fmt(c.w)+'. Horas extras: '+fmt(c.x)+'.',true);
  }
  render();
};
$('rows').onclick=e=>{
  const b=e.target.closest('button[data-d]');if(!b)return;
  const d=b.dataset.d;
  if(pend===d){delete S.rec[d];pend=null;save()}else pend=d;
  render();
};
setInterval(render,15000);
document.addEventListener('visibilitychange',render);
render();
</script>
</body>
</html>
